name: "Continuous Integration"

on:
  pull_request: ~
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  continuous-integration:
    name: "Continuous Integration"

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        include:
          - install-args: "--prefer-lowest"
            php-version: "8.1"
          - install-args: ""
            php-version: "8.1"
          - install-args: ""
            php-version: "8.2"
          - install-args: ""
            php-version: "8.3"
          - install-args: ""
            php-version: "8.4"
      fail-fast: false

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "xdebug"
          php-version: "${{ matrix.php-version }}"
          tools: composer:v2

      - name: composer-cache-dir
        id: composercache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"
      - name: composer-cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.json') }}-${{ matrix.install-args }}
          restore-keys: |
            composer-${{ hashFiles('**/composer.json') }}-${{ matrix.install-args }}
            composer-${{ hashFiles('**/composer.json') }}-
            composer-
      - name: "Install dependencies with composer"
        # Laravel 9 and 10 (the only versions installable on PHP 8.1, and the lowest ones) have published security
        # advisories: Composer refuses to resolve them unless blocking is turned off. A library still tests against them.
        env:
          COMPOSER_NO_BLOCKING: "1"
        run: |
          composer update ${{ matrix.install-args }} --no-interaction --no-progress --prefer-dist
      - name: "Run tests with phpunit/phpunit"
        run: "vendor/bin/phpunit"
